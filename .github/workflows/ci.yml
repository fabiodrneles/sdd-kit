name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # usado pelo workflow de release antes de publicar

permissions:
  contents: read

# Só o pull_request cancela a rodada anterior: o CI da main e o da release (workflow_call)
# ficam em grupos próprios e nunca são cancelados.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck (versão do Makefile)
        run: |
          v="$(sed -n 's/^SHELLCHECK_VERSION *:\?= *//p' Makefile)"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$v/shellcheck-$v.linux.x86_64.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$v" >> "$GITHUB_PATH"
      - name: actionlint (versão do Makefile)
        run: |
          v="$(sed -n 's/^ACTIONLINT_VERSION *:\?= *//p' Makefile)"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/$v/actionlint_${v#v}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: make ci

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress './**/*.md'
          fail: true
          format: json
          output: lychee/out.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # O log do job nem sempre é legível (ex.: agentes atrás de proxy); as
      # anotações aparecem no check e na API.
      - name: Links quebrados como anotações
        if: failure()
        run: >-
          jq -r '((.error_map // {}) + (.timeout_map // {})) | to_entries[] | .key as $f | .value[] | "::error file=\($f),line=\(.span.line // 1)::link quebrado: \(.url) (\(.status.text // .status))"' lychee/out.json

  adopt:
    name: Adoção (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: adopt.sh (spec 004 AC-1..5)
        if: runner.os != 'Windows'
        run: sh tests/adopt.sh
      - name: sdd-check (spec 006 AC-1, AC-2) com as ferramentas do BSD
        if: runner.os == 'macOS'
        run: sh tests/sdd-check.sh
      - name: sdd-sync (spec 005 AC-1..3) com as ferramentas do BSD
        if: runner.os == 'macOS'
        run: sh tests/sync.sh
      - name: adopt.ps1 (spec 004 AC-1..5)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/adopt.ps1

  template:
    name: Template (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [go, node, java, java-gradle, python, rust, dotnet]
    steps:
      - uses: actions/checkout@v7
      - if: matrix.lang == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: tests/fixtures/go/go.mod
      - if: matrix.lang == 'go'
        id: lint
        run: echo "version=$(sed -n 's/^GOLANGCI_LINT_VERSION *:= *//p' template/go/Makefile)" >> "$GITHUB_OUTPUT"
      - if: matrix.lang == 'go'
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.lint.outputs.version }}
          install-only: true
      - if: matrix.lang == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - if: startsWith(matrix.lang, 'java')
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.lang == 'java-gradle'
        uses: gradle/actions/setup-gradle@v6
      - if: matrix.lang == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - if: matrix.lang == 'rust'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - if: matrix.lang == 'dotnet'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Adotar o template e rodar o make ci gerado (spec 003 AC-4)
        run: sh scripts/e2e-template.sh ${{ matrix.lang }}
