# Cria a tag de versão pelo GitHub e publica a release (sem passo local).
# Sem "release-as", a versão é calculada pelos Conventional Commits
# (go-release-manager); com ela, vale a versão do ROADMAP, criada no commit
# "ref" (ex.: o merge do PR de fechamento da fase).
name: Release tag

on:
  workflow_dispatch:
    inputs:
      release-as:
        description: Versão vX.Y.Z do ROADMAP (vazio para calcular pelos commits)
        required: false
        default: ""
      ref:
        description: Commit onde criar a tag (vazio para a branch disparada)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.next }}
      created: ${{ steps.version.outputs.created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        uses: fabiodrneles/go-release-manager@v1.1.0
        with:
          create: true
          release-as: ${{ inputs.release-as }}
          ref: ${{ inputs.ref }}

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
