name: Release

# Publica a skill empacotada quando o dono cria uma tag vX.Y.Z (spec 002 FR-4).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Versão da tag = plugin.json
        run: scripts/check-version.sh "$GITHUB_REF_NAME"
      - name: Empacotar a skill
        run: |
          scripts/package-skill.sh dist/sdd-delivery.zip
          (cd dist && sha256sum sdd-delivery.zip > sdd-delivery.zip.sha256)
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/sdd-delivery.zip dist/sdd-delivery.zip.sha256 --verify-tag --generate-notes
