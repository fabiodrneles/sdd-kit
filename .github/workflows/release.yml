name: Release

# Publica a skill empacotada para uma tag vX.Y.Z (spec 002 FR-4): no push da tag
# ou chamado pelo workflow Release tag (uma tag criada com o GITHUB_TOKEN não
# dispara outros workflows, por isso a chamada direta).
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Versão da tag = plugin.json
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: scripts/check-version.sh "$TAG"
      - name: Empacotar a skill
        run: |
          scripts/package-skill.sh dist/sdd-delivery.zip
          (cd dist && sha256sum sdd-delivery.zip > sdd-delivery.zip.sha256)
      - uses: actions/setup-go@v7
        with:
          go-version-file: axyn/go.mod
      - name: Compilar o axyn (spec 021 FR-1)
        env:
          AXYN_VERSION: ${{ inputs.tag || github.ref_name }}
        run: scripts/build-axyn.sh dist
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # Notas: a seção do CHANGELOG (linguagem simples) e como atualizar; a lista de PRs vem depois.
        run: |
          sh scripts/release-notes.sh "$TAG" > dist/notes.md
          gh release create "$TAG" dist/sdd-delivery.zip dist/sdd-delivery.zip.sha256 dist/axyn_* --verify-tag --notes-file dist/notes.md --generate-notes
