# Gerado por make self-sync a partir de template/common/.github/workflows/sdd-on-merge.yml; não edite.
name: sdd-kit on merge

# Quando um PR de ticket é mergeado, atualiza o checkpoint do épico aberto: feito
# é o PR, próximo é o próximo ticket aberto (spec 015 FR-2 do sdd-kit). Sem LLM.
# Só PRs do próprio repositório; faz checkout só da branch base, nunca do código do PR.
# Desligue com a variável de repositório SDD_ENGINE=off.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: sdd-on-merge
  cancel-in-progress: false

jobs:
  checkpoint:
    name: Atualizar o checkpoint do épico
    if: >-
      vars.SDD_ENGINE != 'off' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'chore/release-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Atualizar o checkpoint
        env:
          GH_TOKEN: ${{ secrets.SDD_ENGINE_TOKEN || github.token }}
          SDD_ENGINE: ${{ vars.SDD_ENGINE }}
          PR: ${{ github.event.pull_request.number }}
        run: sh template/common/scripts/sdd-on-merge.sh --repo "$GITHUB_REPOSITORY" --pr "$PR"
