# Lint de Markdown (spec 001 FR-3). Roda no CI e com "make md".
config:
  MD013: false # tamanho de linha: textos longos são esperados
  MD060: false # estilo de espaçamento do separador de tabela (|---|)
  MD024:
    siblings_only: true # o CHANGELOG repete "Adicionado"/"Alterado" em cada versão
globs:
  - "**/*.md"
ignores:
  - "node_modules/**"
  - "dist/**"
