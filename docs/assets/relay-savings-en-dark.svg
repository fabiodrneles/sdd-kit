<text x="40" y="48" font-size="19" font-weight="700" fill="#ffffff">Cost per ticket: one long session (default) vs the sdd-kit relay</text>
<rect x="40" y="72" width="390" height="104" rx="10" fill="#232322" stroke="#3a3a37"/><text x="64" y="138" font-size="52" font-weight="700" fill="#ffffff">16×</text><text x="64" y="162" font-size="14" fill="#c3c2b7">fewer tokens per ticket</text><rect x="40" y="72" width="6" height="104" rx="3" fill="#3987e5"/><rect x="450" y="72" width="390" height="104" rx="10" fill="#232322" stroke="#3a3a37"/><text x="474" y="138" font-size="52" font-weight="700" fill="#ffffff">5.4×</text><text x="474" y="162" font-size="14" fill="#c3c2b7">less context reread per call</text><rect x="450" y="72" width="6" height="104" rx="3" fill="#3987e5"/><text x="40" y="222" font-size="15" font-weight="600" fill="#ffffff">Tokens spent per ticket</text><text x="40" y="259" font-size="13" fill="#c3c2b7">Long session (default)</text><path d="M200 244 h496.0 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-496.0 z" fill="#d95926"><title>Long session (default): 6.50 million</title></path><text x="710.0" y="259" font-size="13" font-weight="600" fill="#ffffff">6.50 million</text><text x="40" y="299" font-size="13" fill="#c3c2b7">sdd-kit relay</text><path d="M200 284 h27.0 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-27.0 z" fill="#3987e5"><title>sdd-kit relay: 0.40 million</title></path><text x="241.0" y="299" font-size="13" font-weight="600" fill="#ffffff">0.40 million</text><text x="40" y="334" font-size="15" font-weight="600" fill="#ffffff">Context reread on every call</text><text x="40" y="371" font-size="13" fill="#c3c2b7">Long session (default)</text><path d="M200 356 h496.0 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-496.0 z" fill="#d95926"><title>Long session (default): 231 thousand</title></path><text x="710.0" y="371" font-size="13" font-weight="600" fill="#ffffff">231 thousand</text><text x="40" y="411" font-size="13" fill="#c3c2b7">sdd-kit relay</text><path d="M200 396 h89.07359307359307 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-89.07359307359307 z" fill="#3987e5"><title>sdd-kit relay: 43 thousand</title></path><text x="303.0735930735931" y="411" font-size="13" font-weight="600" fill="#ffffff">43 thousand</text><text x="40" y="456" font-size="12" fill="#9a998f">Measured with sdd-report.sh, no LLM: Phase 12 (4 tickets in one long session) vs Phase 13 (3 tickets, one fresh agent each), 2026-10-06.</text><text x="40" y="474" font-size="12" fill="#9a998f">Phase 13 tickets were smaller; context per call does not depend on ticket size.</text></svg>
