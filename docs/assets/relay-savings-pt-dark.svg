03.0735930735931" y="411" font-size="13" font-weight="600" fill="#ffffff">43 mil</text><text x="40" y="456" font-size="12" fill="#9a998f">Medido com sdd-report.sh, sem LLM: Fase 12 (4 tickets numa sessão longa) contra Fase 13 (3 tickets, um agente novo por ticket), 2026-10-06.</text><text x="40" y="474" font-size="12" fill="#9a998f">Os tickets da Fase 13 eram menores; o contexto por chamada não depende do tamanho do ticket.</text></svg>
