<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Custo por ticket numa fase de trabalho: sessão longa contra o relé: 16× menos tokens por ticket, 5,4× menos contexto relido por chamada">
<rect x="0.5" y="0.5" width="879" height="499" rx="12" fill="#fcfcfb" stroke="#e6e5e0"/>
<text x="40" y="48" font-size="19" font-weight="700" fill="#0b0b0b">Custo por ticket numa fase de trabalho: sessão longa contra o relé</text>
<rect x="40" y="72" width="390" height="104" rx="10" fill="#ffffff" stroke="#e6e5e0"/><text x="64" y="138" font-size="52" font-weight="700" fill="#0b0b0b">16×</text><text x="64" y="162" font-size="14" fill="#52514e">menos tokens por ticket</text><rect x="40" y="72" width="6" height="104" rx="3" fill="#2a78d6"/><rect x="450" y="72" width="390" height="104" rx="10" fill="#ffffff" stroke="#e6e5e0"/><text x="474" y="138" font-size="52" font-weight="700" fill="#0b0b0b">5,4×</text><text x="474" y="162" font-size="14" fill="#52514e">menos contexto relido por chamada</text><rect x="450" y="72" width="6" height="104" rx="3" fill="#2a78d6"/><text x="40" y="222" font-size="15" font-weight="600" fill="#0b0b0b">Tokens gastos por ticket</text><text x="40" y="259" font-size="13" fill="#52514e">Sessão longa de trabalho</text><path d="M222 244 h486.0 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-486.0 z" fill="#eb6834"><title>Sessão longa de trabalho: 6,50 milhões</title></path><text x="722.0" y="259" font-size="13" font-weight="600" fill="#0b0b0b">6,50 milhões</text><text x="40" y="299" font-size="13" fill="#52514e">sdd-kit com relé</text><path d="M222 284 h26.38 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-26.38 z" fill="#2a78d6"><title>sdd-kit com relé: 0,40 milhão</title></path><text x="262.38" y="299" font-size="13" font-weight="600" fill="#0b0b0b">0,40 milhão</text><text x="40" y="334" font-size="15" font-weight="600" fill="#0b0b0b">Contexto relido a cada chamada</text><text x="40" y="371" font-size="13" fill="#52514e">Sessão longa de trabalho</text><path d="M222 356 h486.0 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-486.0 z" fill="#eb6834"><title>Sessão longa de trabalho: 231 mil</title></path><text x="722.0" y="371" font-size="13" font-weight="600" fill="#0b0b0b">231 mil</text><text x="40" y="411" font-size="13" fill="#52514e">sdd-kit com relé</text><path d="M222 396 h87.21212121212122 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-87.21212121212122 z" fill="#2a78d6"><title>sdd-kit com relé: 43 mil</title></path><text x="323.21212121212125" y="411" font-size="13" font-weight="600" fill="#0b0b0b">43 mil</text><text x="40" y="456" font-size="12" fill="#77766f">Medido com sdd-report.sh, sem LLM: Fase 12 (4 tickets numa sessão com PRs, CI e conversa) contra Fase 13 (3 tickets, um agente por ticket).</text><text x="40" y="474" font-size="12" fill="#77766f">Os tickets da Fase 13 eram menores; o contexto por chamada não depende do tamanho do ticket.</text></svg>
