# Verificação de links da documentação (spec 001 FR-4). Roda no CI.
exclude_path = [
  "node_modules",
  "dist",
  "template", # links com marcadores {{OWNER}}/{{REPO}}, verificados depois da adoção
  "axyn/templates", # cópia de template/ embutida no axyn (make axyn-templates)
]

exclude = [
  '^mailto:',
  # Links de versão do CHANGELOG e da release: só existem depois da tag do dono.
  '^https://github\.com/fabiodrneles/sdd-kit/(compare|releases)',
]

max_retries = 3
# 429, 502, 503 e 504 são falhas temporárias (limite de acesso, serviço fora); um 404 continua reprovando.
accept = ["200..=299", "429", "502", "503", "504"]
