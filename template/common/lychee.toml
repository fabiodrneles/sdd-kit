# Verificação de links da documentação. Roda no CI (workflow "docs").
exclude_path = ["node_modules", "dist"]

exclude = [
  '^mailto:',
  # Links de versão do CHANGELOG e da release: só existem depois da tag do dono.
  '^https://github\.com/{{OWNER}}/{{REPO}}/(compare|releases)',
]

max_retries = 3
# 429 e 503 são recusas temporárias (limite de acesso, serviço fora); um 404 continua reprovando.
accept = ["200..=299", "429", "503"]
