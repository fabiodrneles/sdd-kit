name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: make ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: ${{ hashFiles('build.gradle.kts', 'build.gradle') != '' && 'gradle' || 'maven' }}
      # Gradle sem wrapper (./gradlew) precisa do gradle instalado.
      - if: hashFiles('build.gradle.kts', 'build.gradle') != ''
        uses: gradle/actions/setup-gradle@v6
      - run: make ci
